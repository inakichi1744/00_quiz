<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社会クイズ一覧｜中学受験</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#2a2118;--brown:#5c4a1e;--brown-l:#a07c3a;--paper:#fdf8ed;--g4:#1565c0;--g5:#7a1e7a;}
body{font-family:'Noto Sans JP',sans-serif;background:#120c02;color:var(--ink);min-height:100vh;padding:0 0 48px;
 background-image:radial-gradient(ellipse at 15% 10%,rgba(160,124,58,.18),transparent 60%),radial-gradient(ellipse at 85% 90%,rgba(160,124,58,.14),transparent 60%);}
header{text-align:center;padding:40px 16px 24px;}
.title{font-family:'Kaisei Decol',serif;font-size:clamp(1.6rem,6vw,2.2rem);color:var(--brown-l);text-shadow:0 2px 12px rgba(160,124,58,.4);}
.sub{color:#c49a5a;font-size:.9rem;margin-top:8px;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
.group{margin-top:28px;}
.group-h{display:flex;align-items:center;gap:10px;color:#e8d9b5;font-weight:700;font-size:1.05rem;margin-bottom:12px;padding-left:4px;}
.badge-grade{font-size:.75rem;font-weight:700;color:#fff;padding:3px 12px;border-radius:999px;}
.g4 .badge-grade{background:var(--g4);} .g5 .badge-grade{background:var(--g5);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.card{display:grid;grid-template-columns:44px 1fr 22px;grid-template-rows:auto auto;column-gap:12px;row-gap:4px;align-items:center;
 background:var(--paper);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);
 border:2px solid rgba(92,74,30,.25);box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s;min-height:84px;}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.35);}
.g5 .card{border-color:rgba(122,30,122,.3);}
.emoji{grid-column:1;grid-row:1/3;font-size:2rem;text-align:center;}
.c-title{grid-column:2;grid-row:1/3;align-self:center;font-weight:700;font-size:1.02rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-meta{grid-column:2;grid-row:2;font-size:.78rem;color:#7a5a2a;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.month{font-size:.72rem;font-weight:700;color:#fff;background:var(--brown);border-radius:999px;padding:1px 9px;}
.go{grid-column:3;grid-row:1/3;font-size:1.2rem;color:var(--brown-l);text-align:center;}
footer{text-align:center;color:#8a7a5a;font-size:.78rem;margin-top:40px;padding:0 16px;line-height:1.7;}
</style>
</head>
<body>
<header>
  <div class="title">📚 社会クイズ一覧</div>
  <div class="sub">中学受験サポート ／ タップして挑戦しよう！</div>
</header>
<div class="wrap">
  <div class="group g4">
    <div class="group-h"><span class="badge-grade">小4</span> 地理・産業</div>
    <div class="grid" id="g4"></div>
  </div>
  <div class="group g5">
    <div class="group-h"><span class="badge-grade">小5</span> 歴史</div>
    <div class="grid" id="g5"></div>
  </div>
</div>
<footer>
  画像はWikimedia Commons（CC0・パブリックドメイン）および各教材より。<br>
  © 中学受験サポート用クイズ集
</footer>
<script>
const BASE='https://inakichi1744.github.io/';
const Q=[
 {g:'g4',repo:'01_g4_ringyou_suisan_quiz',t:'林業・水産業',m:'11月',e:'🌲'},
 {g:'g4',repo:'02_g4_kosan_denryoku_quiz',t:'鉱産資源・電力',m:'12月',e:'⛏️'},
 {g:'g4',repo:'03_g4_kogyo_quiz',t:'工業',m:'12月',e:'🏭'},
 {g:'g4',repo:'04_g4_boueki_quiz',t:'貿易',m:'1月',e:'🚢'},
 {g:'g5',repo:'05_g5_yayoi_kofun_quiz',t:'弥生・古墳時代',m:'3月',e:'🏺'},
 {g:'g5',repo:'06_g5_asuka_quiz',t:'飛鳥時代①',m:'3月',e:'🎴'},
 {g:'g5',repo:'07_g5_asuka-quiz2',t:'飛鳥時代②',m:'4月',e:'⚔️'},
 {g:'g5',repo:'08_g5_nara_quiz',t:'奈良時代',m:'4月',e:'🏯'},
 {g:'g5',repo:'09_g5_heian1_quiz',t:'平安時代①',m:'5月',e:'🌸'},
 {g:'g5',repo:'09_g5_heian2_quiz',t:'平安時代②③',m:'6月',e:'🌸'},
 {g:'g5',repo:'10_g5_muromachi1_quiz',t:'室町時代①',m:'7月',e:'🍵'},
];
Q.forEach(q=>{
  const a=document.createElement('a');
  a.className='card'; a.href=BASE+q.repo+'/';
  a.innerHTML=`<span class="emoji">${q.e}</span><span class="c-title">${q.t}</span><span class="go">▶</span>`;
  document.getElementById(q.g).appendChild(a);
});
</script>
</body>
</html>
